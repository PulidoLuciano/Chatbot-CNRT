version: '3.8'

services:
  # Servicio 1: n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-cnrt
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      # Zona horaria de Argentina para los logs correctos
      - GENERIC_TIMEZONE=America/Argentina/Tucuman
    volumes:
      - n8n_data:/home/node/.n8n

  # Servicio 2: Qdrant
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant-cnrt
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  
  redis:
    image: redis:alpine
    container_name: redis-cnrt
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  n8n_data:
  qdrant_data:
  redis_data: